apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Single source of truth for the version: package.json.
//
// These were hardcoded at 1.0 / 1 and never moved, so every release told
// Android it was the same build. The device reported "1.0" no matter what was
// installed, and because versionCode never increased the OS could not tell a
// newer APK from a reinstall. The in-app updater compares package.json against
// the release tag, so this has to track it exactly.
def pkgVersion = new groovy.json.JsonSlurper()
        .parse(file('../../package.json')).version
def semver = pkgVersion.toString().tokenize('.')
// 1.0.6 -> 10006. Monotonic while minor and patch stay under 100.
def numericVersion = semver[0].toInteger() * 10000 +
        semver[1].toInteger() * 100 +
        semver[2].toInteger()

// Release signing comes from the environment so CI can inject it and a
// local build needs nothing. assembleRelease with no signing config does
// NOT fail -- it emits an uninstallable unsigned APK -- so guard on the
// keystore actually existing and let the workflow verify with apksigner.
def ksStoreFile = System.getenv("ANDROID_KEYSTORE_FILE")
def ksStorePass = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def ksKeyAlias  = System.getenv("ANDROID_KEY_ALIAS")
def ksKeyPass   = System.getenv("ANDROID_KEY_PASSWORD")
def canSignRelease = ksStoreFile != null && !ksStoreFile.toString().isEmpty() && file(ksStoreFile).exists()


android {
    namespace = "team.superfun.bullets"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "team.superfun.bullets"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode numericVersion
        versionName pkgVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (canSignRelease) {
                storeFile     file(ksStoreFile)
                storePassword ksStorePass
                keyAlias      ksKeyAlias
                keyPassword   ksKeyPass
                // Pinned rather than left to whatever the AGP default is that
                // week: the shipped v1.2.3 APK came out v2-only. v1 is dead
                // weight above minSdk 24; v3 is what allows the signing key to
                // be rotated later without every install breaking.
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (canSignRelease) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("No release keystore configured -- assembleRelease will emit an UNSIGNED APK.")
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
