name: Release

# Bump package.json, tag vX.Y.Z, and push the tag. One release job waits for
# both platform builds, so its APK, DMG, ZIP, and update metadata land together.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    # ubuntu-latest already ships Android SDK 36 and sets ANDROID_HOME.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # capacitor.build.gradle hardcodes VERSION_21 and is regenerated on
          # every cap sync, so editing it is futile. JDK 17 fails outright.
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # The wrapper fetches the Gradle distribution from GitHub's CDN on first
      # use, and a transient 503 there failed a release with nothing wrong in
      # the build. Warm it up with retries so a CDN blip costs seconds, not a
      # re-run of the whole workflow.
      - name: Warm the Gradle distribution
        working-directory: android
        run: |
          chmod +x ./gradlew
          for attempt in 1 2 3 4 5; do
            if ./gradlew --version >/dev/null 2>&1; then
              echo "gradle ready (attempt $attempt)"
              exit 0
            fi
            echo "::warning::gradle distribution fetch failed (attempt $attempt); retrying"
            sleep $((attempt * 15))
          done
          echo "::error::could not fetch the Gradle distribution after 5 attempts"
          exit 1

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Decode release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret. Building a debug-signed APK instead. See docs/android-signing.md"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore" || { echo "::error::Keystore decoded to an empty file"; exit 1; }
          echo "present=true" >> "$GITHUB_OUTPUT"

      - run: chmod +x ./android/gradlew

      - name: Build signed release APK
        if: steps.keystore.outputs.present == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Build debug APK
        if: steps.keystore.outputs.present == 'false'
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      # assembleRelease with a broken signing config SUCCEEDS and emits an
      # uninstallable app-release-unsigned.apk. Without this check a typo'd
      # secret name ships a green build full of garbage.
      - name: Verify the APK is actually signed
        if: steps.keystore.outputs.present == 'true'
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Stage the APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p out
          if [ "${{ steps.keystore.outputs.present }}" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "out/bullets-${VERSION}.apk"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "out/bullets-${VERSION}-debug.apk"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: out/*
          if-no-files-found: error
          retention-days: 90

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    outputs:
      signed: ${{ steps.credentials.outputs.present }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check macOS signing credentials
        id: credentials
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for value in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!value}" ]; then
              echo "::notice::macOS release skipped: missing repository secret $value"
              echo "present=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Write App Store Connect API key
        if: steps.credentials.outputs.present == 'true'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$key_path"
          test -s "$key_path" || { echo "::error::App Store Connect API key decoded empty"; exit 1; }
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Build, sign, and notarize universal macOS release
        if: steps.credentials.outputs.present == 'true'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run mac:dist -- --config.forceCodeSigning=true

      - name: Verify notarized app bundle
        if: steps.credentials.outputs.present == 'true'
        run: |
          codesign --verify --deep --strict --verbose=2 release/mac-universal/Bullets.app
          xcrun stapler validate release/mac-universal/Bullets.app
          spctl --assess --type execute --verbose=4 release/mac-universal/Bullets.app

      - uses: actions/upload-artifact@v7
        if: steps.credentials.outputs.present == 'true'
        with:
          name: macos-release
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 90

      - name: Remove App Store Connect API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  publish:
    needs: [android, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: android-release
          path: out

      - uses: actions/download-artifact@v7
        if: needs.macos.outputs.signed == 'true'
        with:
          name: macos-release
          path: out

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Bullets ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: out/*
