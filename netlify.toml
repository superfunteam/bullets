[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888

# The SPA fallback must stay last. Functions declaring an explicit config.path
# are matched by the platform ahead of it, so /api/* still reaches them.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
